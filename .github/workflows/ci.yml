name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - run: node tests/parity.cjs
      - run: python -B demo.py --budget 35 --taste spicy
      - run: python -B scripts/build_demo.py && git diff --exit-code -- docs/data.js
